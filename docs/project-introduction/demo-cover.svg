<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EduLoom 项目演示视频</title>
  <desc id="desc">点击封面观看 EduLoom 项目介绍与功能演示视频</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="105" r="210" fill="#ffffff" opacity="0.05"/>
  <circle cx="155" cy="650" r="260" fill="#67e8f9" opacity="0.06"/>
  <text x="640" y="200" fill="#a5f3fc" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600" text-anchor="middle" letter-spacing="5">EDULOOM · 学织</text>
  <text x="640" y="280" fill="#ffffff" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" text-anchor="middle">项目介绍与功能演示</text>
  <g filter="url(#shadow)">
    <circle cx="640" cy="420" r="82" fill="#ffffff"/>
    <path d="M620 374 L620 466 L692 420 Z" fill="#4338ca"/>
  </g>
  <text x="640" y="570" fill="#dbeafe" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" text-anchor="middle">点击封面观看完整视频</text>
  <text x="640" y="625" fill="#99f6e4" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" text-anchor="middle">基于大模型多智能体协同的个性化学习系统</text>
</svg>
